<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Adminerva | Dev Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-slate-900 h-screen flex flex-col items-center justify-center font-mono text-slate-300"
  >
    <div
      class="bg-slate-800 p-8 rounded-xl shadow-2xl border border-slate-700 max-w-md w-full text-center"
    >
      <img
        src="assets/New Adminerva logo.png"
        alt="Adminerva Logo"
        class="h-16 mx-auto mb-4 object-contain mix-blend-lighten drop-shadow-[0_0_10px_rgba(16,185,129,0.4)]"
      />

      <h1 class="text-2xl text-emerald-400 font-black tracking-widest mb-2">
        DEV GATEWAY
      </h1>
      <p class="text-xs text-slate-500 mb-8 uppercase tracking-wider">
        Role Simulation & Testing
      </p>

      <!-- TEST LOGIN STATE -->
      <div id="loginState" class="space-y-4">
        <button
          onclick="handleLogin('test1@g.com', 'admin123')"
          class="w-full bg-blue-600/20 border border-blue-500/50 text-blue-400 font-bold py-3 px-4 rounded hover:bg-blue-600/40 hover:text-white transition flex justify-between items-center group"
        >
          <span>👀 Boot Student POV</span>
          <span class="text-xs font-normal opacity-50 group-hover:opacity-100"
            >test1@g.com</span
          >
        </button>

        <button
          onclick="handleLogin('josephsixson@mcstayuman.edu.ph', 'teacher123')"
          class="w-full bg-amber-600/20 border border-amber-500/50 text-amber-400 font-bold py-3 px-4 rounded hover:bg-amber-600/40 hover:text-white transition flex justify-between items-center group"
        >
          <span>🎓 Boot Teacher POV</span>
          <span class="text-xs font-normal opacity-50 group-hover:opacity-100"
            >josephsixson@...</span
          >
        </button>

        <button
          onclick="handleLogin('testadmin@example.com', 'password123')"
          class="w-full bg-purple-600/20 border border-purple-500/50 text-purple-400 font-bold py-3 px-4 rounded hover:bg-purple-600/40 hover:text-white transition flex justify-between items-center group"
        >
          <span>🛡️ Boot Super Admin</span>
          <span class="text-xs font-normal opacity-50 group-hover:opacity-100"
            >testadmin@...</span
          >
        </button>
      </div>

      <!-- SHAPE-SHIFTER STATE (If already logged in) -->
      <div id="shifterState" class="hidden space-y-4">
        <p class="text-xs text-emerald-400 mb-4 border-b border-slate-700 pb-2">
          Active Session Detected. Select a role to simulate:
        </p>

        <button
          onclick="simulateRole('student', 'student-dashboard.html')"
          class="w-full bg-slate-700 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded transition shadow"
        >
          👀 Simulate Student View
        </button>

        <button
          onclick="simulateRole('teacher', 'reporeviewDashboard.html')"
          class="w-full bg-slate-700 hover:bg-amber-600 text-white font-bold py-3 px-4 rounded transition shadow"
        >
          🎓 Simulate Teacher View
        </button>

        <button
          onclick="simulateRole(null, 'reporeviewDashboard.html')"
          class="w-full mt-4 bg-emerald-600/20 border border-emerald-500/50 text-emerald-400 hover:bg-emerald-600 hover:text-white font-bold py-3 px-4 rounded transition shadow"
        >
          ♻️ Restore Real Role
        </button>

        <button
          id="devSignOut"
          class="w-full mt-2 text-xs text-red-400 hover:text-red-300 py-2"
        >
          Sign Out Entirely
        </button>
      </div>

      <div
        id="statusBox"
        class="mt-6 h-12 flex items-center justify-center text-sm font-bold"
      ></div>
    </div>

    <script type="module">
      import { auth } from "./js/core/firebase-core.js";
      import {
        signInWithEmailAndPassword,
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

      const statusBox = document.getElementById("statusBox");
      const loginState = document.getElementById("loginState");
      const shifterState = document.getElementById("shifterState");

      onAuthStateChanged(auth, (user) => {
        if (user) {
          loginState.classList.add("hidden");
          shifterState.classList.remove("hidden");
          statusBox.innerHTML = `<span class="text-emerald-500 text-xs">Logged in as: ${user.email}</span>`;
        } else {
          loginState.classList.remove("hidden");
          shifterState.classList.add("hidden");
        }
      });

      window.handleLogin = (email, password) => {
        statusBox.innerHTML =
          '<span class="text-slate-400 animate-pulse">Authenticating...</span>';
        signInWithEmailAndPassword(auth, email, password)
          .then(() => {
            statusBox.innerHTML =
              '<span class="text-emerald-500">Access Granted. Routing...</span>';
            setTimeout(
              () => (window.location.href = "reporeviewDashboard.html"),
              600,
            );
          })
          .catch((error) => {
            statusBox.innerHTML = `<span class="text-red-500 text-[10px] leading-tight">${error.message.replace("Firebase:", "").trim()}</span>`;
          });
      };

      window.simulateRole = (mockRole, redirectUrl) => {
        if (mockRole) localStorage.setItem("Adminerva_Mock_Role", mockRole);
        else localStorage.removeItem("Adminerva_Mock_Role");
        window.location.href = redirectUrl;
      };

      document.getElementById("devSignOut").addEventListener("click", () => {
        signOut(auth).then(() => {
          localStorage.removeItem("Adminerva_Role");
          localStorage.removeItem("Adminerva_Mock_Role");
          window.location.reload();
        });
      });
    </script>
  </body>
</html>
