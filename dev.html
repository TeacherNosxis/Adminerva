<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dev Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-slate-900 h-screen flex items-center justify-center font-mono"
  >
    <div class="text-center">
      <h1 class="text-emerald-400 font-bold mb-4">
        Initializing Test Environment...
      </h1>
      <div id="status" class="text-slate-400 text-sm">
        Authenticating teststudent@example.com
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
      import {
        getAuth,
        signInWithEmailAndPassword,
      } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

      const configStr = localStorage.getItem("Adminerva_firebase_config");

      if (!configStr) {
        document.getElementById("status").innerHTML =
          '<span class="text-red-500">Error: Firebase keys not found in local storage. Log into the Admin Hub first.</span>';
      } else {
        const app = initializeApp(JSON.parse(configStr));
        const auth = getAuth(app);

        // Instantly logs you in using the test credentials
        signInWithEmailAndPassword(auth, "test1@g.com", "admin123")
          .then(() => {
            document.getElementById("status").innerHTML =
              '<span class="text-emerald-500">Success. Redirecting...</span>';
            setTimeout(
              () => (window.location.href = "student-dashboard.html"),
              800,
            );
          })
          .catch((error) => {
            document.getElementById("status").innerHTML =
              `<span class="text-red-500">Error: ${error.message}</span>`;
          });
      }
    </script>
  </body>
</html>
