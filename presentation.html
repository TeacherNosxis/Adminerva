<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adminerva - Slide Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Quill.js for Rich Text & Toolbar -->
    <link
      href="https://cdn.quilljs.com/1.3.6/quill.snow.css"
      rel="stylesheet"
    />
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <!-- Force Quill Editor to be strictly transparent -->
    <style>
      .ql-container.ql-snow {
        border: none !important;
      }
      .ql-editor {
        background-color: transparent !important;
      }
    </style>

    <!-- KaTeX for Math Equations -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  </head>
  <body class="bg-gray-50 font-sans min-h-screen flex flex-col text-gray-800">
    <!-- GLOBAL NAVIGATION INJECTION -->
    <div id="adminerva-nav" data-module="lesson" data-page="presentation"></div>
    <script src="js/core/adminerva-nav.js"></script>

    <!-- Main Workspace -->
    <div
      class="max-w-screen-2xl mx-auto w-full p-6 mt-4 flex-1 flex flex-col lg:flex-row gap-6"
    >
      <!-- LEFT COLUMN: Slide Block Navigation -->
      <div
        class="w-full lg:w-1/4 bg-white p-4 rounded-lg shadow-sm border border-gray-200 flex flex-col"
      >
        <div class="border-b border-gray-200 pb-3 mb-4">
          <h2 class="text-lg font-bold text-gray-800">SLIDE BLOCKS</h2>
          <div class="flex gap-2 mt-2">
            <select
              id="slideTemplateSelect"
              class="flex-1 p-1.5 border border-gray-300 rounded text-xs bg-gray-50 focus:ring-blue-500"
            >
              <option value="default">Default Template</option>
            </select>
            <!-- 🚀 FIX: Added onclick command -->
            <button
              onclick="addNewSlide()"
              class="bg-blue-600 text-white px-3 py-1.5 rounded text-xs font-bold hover:bg-blue-700 transition"
            >
              + Add
            </button>
          </div>
        </div>

        <div class="flex-1 overflow-y-auto space-y-2" id="slideBlockList">
          <!-- Dynamic Blocks -->
        </div>

        <!-- 🚀 FIX: Added onclick command for the final step -->
        <button
          onclick="exportToPPTX()"
          class="w-full mt-4 bg-gray-800 hover:bg-gray-700 text-white font-bold py-2 rounded transition shadow-md"
        >
          Export to PPTX
        </button>
      </div>

      <!-- RIGHT COLUMN: Editor Workspace -->
      <div
        class="w-full lg:w-3/4 bg-white rounded-lg shadow-sm border border-gray-200 flex flex-col items-center justify-start p-6 relative"
      >
        <!-- Layout Switcher Header -->
        <div class="w-full max-w-4xl flex justify-between items-end mb-4">
          <div>
            <label
              class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1"
              >Slide Layout</label
            >
            <select
              id="slideLayoutSelector"
              onchange="changeSlideLayout(this.value)"
              class="p-1.5 border border-gray-300 rounded text-sm bg-gray-50 focus:ring-blue-500 font-bold text-blue-900 shadow-sm"
            >
              <option value="standard">Standard (1 Column)</option>
              <option value="split">Split (2 Columns)</option>
              <option value="media">Full Media (Image)</option>
            </select>
          </div>
          <span
            id="overflowWarning"
            class="hidden text-xs text-red-600 font-bold bg-red-50 px-2 py-1 rounded border border-red-200"
          >
            ⚠️ Slide Height Limit Reached
          </span>
        </div>

        <!-- 16:9 Aspect Ratio Canvas -->
        <div
          class="w-full max-w-4xl aspect-[16/9] bg-cover bg-center bg-no-repeat border-2 border-gray-300 relative overflow-hidden flex flex-col group shadow-md"
          id="slide-canvas"
          style="background-color: #f8fafc"
        >
          <!-- 12% Top Ribbon -->
          <div
            id="slide-ribbon"
            class="h-[12%] w-full bg-blue-50/80 backdrop-blur-sm border-b border-blue-100 flex items-center px-6 justify-between z-20 transition-all"
          >
            <div class="flex items-center gap-3">
              <img
                src="assets/New Adminerva logo.png"
                class="h-8 opacity-80"
                alt="Logo"
              />
              <div class="flex flex-col">
                <span
                  class="text-xs font-bold text-blue-900 uppercase tracking-wide leading-none"
                  >Main Lesson Title</span
                >
                <span class="text-[9px] text-gray-500 leading-none mt-1"
                  >Subtopic Context</span
                >
              </div>
            </div>
          </div>

          <!-- 🚀 LAYOUT 1: Standard (Embedded Toolbar) -->
          <div
            id="layout-standard"
            class="flex-1 flex flex-col relative z-20 bg-white/40 backdrop-blur-[2px]"
          >
            <div
              id="toolbar-standard"
              class="w-full bg-gray-50/90 border-b border-gray-300 z-50"
            >
              <span class="ql-formats"
                ><select class="ql-header">
                  <option value="1"></option>
                  <option value="2"></option>
                  <option selected></option></select
              ></span>
              <span class="ql-formats"
                ><button class="ql-bold"></button
                ><button class="ql-italic"></button
                ><button class="ql-underline"></button
              ></span>
              <span class="ql-formats"
                ><button class="ql-list" value="ordered"></button
                ><button class="ql-list" value="bullet"></button
              ></span>
              <span class="ql-formats"
                ><button class="ql-formula"></button
              ></span>
            </div>
            <div class="flex-1 p-8">
              <div
                id="editor-container"
                class="h-full w-full text-2xl leading-relaxed text-gray-900 border-none outline-none"
              ></div>
            </div>
          </div>

          <!-- 🚀 LAYOUT 2: Split (Embedded Mini-Toolbars) -->
          <div
            id="layout-split"
            class="hidden flex-1 relative z-20 bg-white/40 backdrop-blur-[2px]"
          >
            <div class="flex h-full w-full">
              <!-- Left Column -->
              <div class="flex-1 flex flex-col border-r border-gray-300/50">
                <div
                  id="toolbar-left"
                  class="w-full bg-gray-50/90 border-b border-gray-300 z-50 py-1 px-2"
                >
                  <span class="ql-formats"
                    ><button class="ql-bold"></button
                    ><button class="ql-italic"></button
                    ><button class="ql-list" value="bullet"></button
                  ></span>
                </div>
                <div class="flex-1 p-5">
                  <div
                    id="editor-left"
                    class="h-full w-full text-xl leading-relaxed text-gray-900 border-none outline-none"
                  ></div>
                </div>
              </div>
              <!-- Right Column -->
              <div class="flex-1 flex flex-col">
                <div
                  id="toolbar-right"
                  class="w-full bg-gray-50/90 border-b border-gray-300 z-50 py-1 px-2"
                >
                  <span class="ql-formats"
                    ><button class="ql-bold"></button
                    ><button class="ql-italic"></button
                    ><button class="ql-list" value="bullet"></button
                  ></span>
                </div>
                <div class="flex-1 p-5">
                  <div
                    id="editor-right"
                    class="h-full w-full text-xl leading-relaxed text-gray-900 border-none outline-none"
                  ></div>
                </div>
              </div>
            </div>
          </div>

          <!-- 🚀 LAYOUT 3: Full Media -->
          <div
            id="layout-media"
            class="hidden absolute inset-0 z-30 bg-black/90 flex-col items-center justify-center group"
          >
            <img
              id="media-preview-img"
              src=""
              class="hidden max-w-full max-h-full object-contain"
            />
            <div
              id="media-upload-ui"
              class="text-center p-6 bg-white/10 backdrop-blur rounded-xl border border-white/20"
            >
              <span class="block text-4xl mb-3">🖼️</span>
              <p class="text-white font-bold text-lg mb-4">Media Slide</p>
              <button
                onclick="document.getElementById('mediaFileInput').click()"
                class="bg-blue-600 text-white px-6 py-2 rounded text-sm font-bold shadow hover:bg-blue-700 transition"
              >
                Upload Image
              </button>
              <p class="text-[10px] text-gray-400 mt-3">JPEG/PNG Max 800KB</p>
              <input
                type="file"
                id="mediaFileInput"
                accept="image/*"
                class="hidden"
                onchange="handleMediaUpload(event)"
              />
            </div>
            <button
              onclick="clearMediaSlide()"
              class="absolute top-4 right-4 bg-red-600/80 hover:bg-red-600 text-white px-3 py-1 rounded text-xs font-bold hidden group-hover:block transition shadow"
            >
              ✖ Remove
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 🚀 FIXED SCRIPTS (No Stray Tags) -->
    <script src="js/presentation-review/presentation-ui.js?v=5"></script>
    <script
      type="module"
      src="js/presentation-review/presentation-firebase.js?v=5"
    ></script>
    <script
      type="module"
      src="js/presentation-review/presentation-ai.js?v=5"
    ></script>
  </body>
</html>
