<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings | Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col hidden"
    id="pageBody"
  >
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
          <div class="flex items-center gap-6">
            <span class="text-xl font-bold text-blue-600">Adminerva</span>
            <a
              href="student-dashboard.html"
              class="text-sm font-medium text-slate-500 hover:text-blue-600"
              >Dashboard</a
            >
            <a
              href="student-settings.html"
              class="text-sm font-bold text-blue-600 border-b-2 border-blue-600 py-5"
              >Settings</a
            >
          </div>
          <div class="flex items-center gap-4">
            <span
              id="userEmailDisplay"
              class="text-sm font-medium text-slate-600"
            ></span>
            <button
              id="signOutBtn"
              class="text-sm text-red-600 hover:text-red-700 font-bold transition"
            >
              Sign Out
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-2xl mx-auto w-full px-4 py-12">
      <h1 class="text-2xl font-extrabold text-slate-900 mb-6">
        Account Settings
      </h1>

      <div
        id="rosterError"
        class="hidden mb-6 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg font-medium"
      >
        Your email is not currently registered in the class roster. Please
        contact your instructor.
      </div>

      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h3
          class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"
        >
          <span>⚙️</span> Repository Connection
        </h3>
        <p class="text-sm text-slate-500 mb-6">
          Link your specific GitHub username and public repository URL so the
          AutoGrader can track your individual contributions.
        </p>

        <form id="repoForm" class="space-y-4">
          <div>
            <label
              class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1"
              >GitHub Username</label
            >
            <input
              type="text"
              id="githubUsername"
              class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
              placeholder="e.g., octocat"
              required
            />
          </div>
          <div>
            <label
              class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1"
              >Repository URL</label
            >
            <input
              type="url"
              id="repoUrl"
              class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
              placeholder="https://github.com/user/repo"
              required
            />
          </div>

          <button
            type="submit"
            id="saveRepoBtn"
            class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-700 transition shadow-sm disabled:opacity-50 mt-4"
          >
            Save Configuration
          </button>
          <p id="saveStatus" class="text-xs font-medium text-center hidden"></p>
        </form>
      </div>
    </main>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
      import {
        getAuth,
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
      import {
        getFirestore,
        collection,
        query,
        where,
        getDocs,
        updateDoc,
        doc,
      } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

      const configStr = localStorage.getItem("Adminerva_firebase_config");
      if (!configStr) window.location.href = "login.html";

      const app = initializeApp(JSON.parse(configStr));
      const auth = getAuth(app);
      const db = getFirestore(app);
      let currentStudentDocId = null;

      onAuthStateChanged(auth, async (user) => {
        if (!user) return (window.location.href = "login.html");
        document.getElementById("pageBody").classList.remove("hidden");
        document.getElementById("userEmailDisplay").textContent = user.email;

        try {
          const q = query(
            collection(db, "students"),
            where("email", "==", user.email.toLowerCase()),
          );
          const snap = await getDocs(q);
          if (snap.empty) {
            document.getElementById("rosterError").classList.remove("hidden");
            document.getElementById("saveRepoBtn").disabled = true;
            return;
          }
          snap.forEach((d) => {
            currentStudentDocId = d.id;
            const data = d.data();
            if (data.githubUsername)
              document.getElementById("githubUsername").value =
                data.githubUsername;
            if (data.repoUrl)
              document.getElementById("repoUrl").value = data.repoUrl;
          });
        } catch (error) {
          console.error(error);
        }
      });

      document
        .getElementById("repoForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          if (!currentStudentDocId) return;
          const btn = document.getElementById("saveRepoBtn");
          const status = document.getElementById("saveStatus");
          btn.disabled = true;
          btn.textContent = "Saving...";
          status.classList.add("hidden");

          try {
            await updateDoc(doc(db, "students", currentStudentDocId), {
              githubUsername: document
                .getElementById("githubUsername")
                .value.trim(),
              repoUrl: document.getElementById("repoUrl").value.trim(),
            });
            status.textContent = "✅ Settings saved successfully!";
            status.className =
              "text-xs font-bold text-center text-green-600 mt-2 block";
          } catch (error) {
            status.textContent = "❌ Error saving data.";
            status.className =
              "text-xs font-bold text-center text-red-600 mt-2 block";
          } finally {
            btn.disabled = false;
            btn.textContent = "Save Configuration";
          }
        });

      document.getElementById("signOutBtn").addEventListener("click", () => {
        signOut(auth).then(() => (window.location.href = "login.html"));
      });
    </script>
  </body>
</html>
