<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings | Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col hidden"
    id="pageBody"
  >
    <!-- Replace the <nav> block with this: -->
    <div id="adminerva-nav" data-module="student" data-page="settings"></div>

    <!-- Main Content -->
    <main class="flex-grow max-w-2xl mx-auto w-full px-4 py-12">
      <h1 class="text-2xl font-extrabold text-slate-900 mb-6 tracking-tight">
        Account Settings
      </h1>

      <div
        id="rosterError"
        class="hidden mb-6 p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg font-medium shadow-sm"
      >
        Your email is not currently registered in the class roster. Please
        contact your instructor.
      </div>

      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <h3
          class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"
        >
          <span class="text-blue-500">⚙️</span> Repository Connection
        </h3>
        <p class="text-sm text-slate-500 mb-6">
          Link your specific GitHub username and public repository URL so the
          automated system can track your individual contributions.
        </p>

        <form id="repoForm" class="space-y-4">
          <div>
            <label
              class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1"
              >GitHub Username</label
            >
            <input
              type="text"
              id="githubUsername"
              class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
              placeholder="e.g., octocat"
              required
            />
          </div>
          <div>
            <label
              class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1"
              >Repository URL</label
            >
            <input
              type="url"
              id="repoUrl"
              class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"
              placeholder="https://github.com/user/repo"
              required
            />
          </div>

          <button
            type="submit"
            id="saveRepoBtn"
            class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-700 transition shadow-sm disabled:opacity-50 mt-4"
          >
            Save Configuration
          </button>
          <p id="saveStatus" class="text-xs font-medium text-center hidden"></p>
        </form>
      </div>
    </main>

    <script type="module" src="js/student/settings.js"></script>
    <script src="js/core/adminerva-loader.js"></script>
  </body>
</html>
