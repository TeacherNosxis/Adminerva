<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LessonReview - Reference Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .group-hover-show {
        visibility: hidden;
      }
      .group:hover .group-hover-show {
        visibility: visible;
      }
    </style>
  </head>
  <body class="bg-gray-50 font-sans min-h-screen flex flex-col">
    <div id="adminerva-nav" data-module="lesson" data-page="library"></div>
    <script src="js/core/adminerva-nav.js"></script>

    <!-- Main Workspace -->
    <div
      class="max-w-screen-2xl mx-auto w-full p-6 mt-4 flex-1 flex flex-col lg:flex-row gap-6"
    >
      <!-- LEFT COLUMN: Folder Directory -->
      <div
        class="w-full lg:w-1/4 bg-white p-6 rounded-lg shadow-sm border border-gray-200 flex flex-col"
      >
        <h2 class="text-xl font-bold text-gray-800 border-b pb-2 mb-4">
          My Drive
        </h2>

        <div class="flex gap-2 mb-6">
          <input
            type="text"
            id="newFolderInput"
            placeholder="New folder name..."
            class="w-full p-2 border rounded text-sm focus:ring-blue-500 bg-gray-50"
          />
          <button
            onclick="createFolder()"
            class="bg-blue-600 text-white px-3 py-2 rounded font-bold hover:bg-blue-700 transition text-sm"
          >
            + New
          </button>
        </div>

        <div id="folderList" class="flex-1 overflow-y-auto space-y-1">
          <!-- Dynamically injected folders -->
        </div>
      </div>

      <!-- RIGHT COLUMN: Drive Workspace -->
      <div
        class="w-full lg:w-3/4 bg-white rounded-lg shadow-sm border border-gray-200 flex flex-col"
      >
        <!-- Top Toolbar -->
        <div class="p-4 border-b flex justify-between items-center bg-gray-50">
          <h2
            id="activeFolderTitle"
            class="text-xl font-bold text-gray-800 flex items-center gap-2"
          >
            <span>📂</span> Select a Folder
          </h2>

          <div
            class="flex gap-4 items-center w-1/2 justify-end hidden"
            id="driveToolbar"
          >
            <input
              type="text"
              id="searchInput"
              oninput="filterDocuments()"
              placeholder="Search in folder..."
              class="w-full max-w-sm p-2 border rounded-full text-sm bg-white focus:ring-2 focus:ring-blue-500 pl-4 shadow-inner"
            />
            <button
              onclick="document.getElementById('pdfFileInput').click()"
              class="bg-blue-100 text-blue-700 font-bold py-2 px-4 rounded hover:bg-blue-200 transition whitespace-nowrap"
            >
              📄 Upload PDF
            </button>
            <input
              type="file"
              id="pdfFileInput"
              accept="application/pdf"
              class="hidden"
              onchange="extractPDF()"
            />
          </div>
        </div>

        <!-- Document List Area -->
        <div id="documentWorkspace" class="p-0 hidden flex-col flex-1">
          <!-- Table Header -->
          <div
            class="grid grid-cols-12 gap-4 px-6 py-3 border-b bg-gray-50 text-xs font-bold text-gray-500 uppercase tracking-wider"
          >
            <div class="col-span-6">Name</div>
            <div class="col-span-4">Last Modified</div>
            <div class="col-span-2 text-right">Actions</div>
          </div>

          <!-- Document Rows -->
          <div id="documentList" class="flex-1 overflow-y-auto">
            <!-- Extracted text snippets injected here -->
          </div>
        </div>

        <!-- Blank State -->
        <div
          id="blankWorkspace"
          class="p-6 flex-1 flex flex-col items-center justify-center text-gray-400 italic"
        >
          <span class="text-6xl mb-4">🗂️</span>
          <p>Select a folder on the left to view or upload documents.</p>
        </div>
      </div>
    </div>

    <!-- GLOBAL LOADING OVERLAY -->
    <div
      id="extractionLoader"
      class="hidden fixed inset-0 bg-gray-900 bg-opacity-85 z-[100] items-center justify-center flex-col"
    >
      <div
        class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-500 border-solid mb-4"
      ></div>
      <p class="text-white font-bold text-xl tracking-wider mb-2">
        Extracting PDF Data...
      </p>
    </div>

    <script type="module" src="js/lesson-review/library.js"></script>
  </body>
</html>
