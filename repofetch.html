<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adminerva - RepoFetch Grader</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 font-sans min-h-screen flex flex-col">
    <!-- Navigation Bar -->
    <div id="adminerva-nav" data-module="repo" data-page="repofetch"></div>
    <script src="js/core/adminerva-nav.js"></script>

    <!-- Main Workspace -->
    <div class="max-w-screen-xl mx-auto w-full p-6 mt-4 flex-1">
      <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200">
        <div class="flex justify-between items-end mb-6 border-b pb-4">
          <div>
            <h2 class="text-2xl font-bold text-gray-800">RepoFetch Grader</h2>
            <p class="text-sm text-gray-500 mt-1">
              Automated hybrid grading for Q2 PETA 2 & 3.
            </p>
          </div>
          <button
            onclick="runRepoFetch()"
            class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700 transition shadow"
          >
            Fetch & Grade All
          </button>
        </div>

        <!-- Grading Table -->
        <div class="overflow-x-auto w-full border rounded-lg shadow-sm">
          <table class="min-w-full bg-white">
            <thead class="bg-gray-100 border-b-2 border-gray-200">
              <tr>
                <th
                  class="py-3 px-4 text-left text-xs font-bold text-gray-600 uppercase"
                >
                  Student
                </th>
                <th
                  class="py-3 px-4 text-left text-xs font-bold text-gray-600 uppercase"
                >
                  PETA Target (Path)
                </th>
                <th
                  class="py-3 px-4 text-center text-xs font-bold text-gray-600 uppercase"
                >
                  Objective / Delivery (10 pts)
                </th>
                <th
                  class="py-3 px-4 text-left text-xs font-bold text-gray-600 uppercase"
                >
                  AI Subjective Score
                </th>
              </tr>
            </thead>
            <tbody id="fetchTableBody">
              <tr>
                <td colspan="4" class="py-8 text-center text-gray-400 italic">
                  Click "Fetch & Grade All" to start.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="js/core/adminerva-loader.js"></script>
    <script type="module" src="js/repo-review/repofetch.js"></script>
  </body>
</html>
