<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adminerva - RepoFetch Grader</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 font-sans min-h-screen flex flex-col">
    <div id="adminerva-nav" data-module="repo" data-page="repofetch"></div>
    <script src="js/core/adminerva-nav.js"></script>

    <div class="max-w-screen-xl mx-auto w-full p-6 mt-4 flex-1">
      <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200">
        <div class="flex justify-between items-end mb-6 border-b pb-4">
          <div>
            <h2 class="text-2xl font-bold text-gray-800">RepoFetch Grader</h2>
            <p class="text-sm text-gray-500 mt-1">
              Smart caching: Loads instantly from the DB, then silently syncs
              new GitHub commits.
            </p>
          </div>
        </div>

        <!-- Section Filters & Single Action Button -->
        <div
          class="flex flex-col md:flex-row gap-4 mb-6 bg-gray-50 p-4 rounded-lg border border-gray-200 items-end"
        >
          <div class="flex-1 w-full">
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1"
              >Class Section</label
            >
            <select
              id="sectionSelect"
              class="w-full p-2.5 border rounded font-semibold focus:ring-blue-500 bg-white text-sm"
            ></select>
          </div>
          <div class="w-full md:w-auto">
            <button
              onclick="fetchAndSyncRepos()"
              class="w-full bg-blue-600 text-white px-6 py-2.5 rounded font-bold hover:bg-blue-700 transition shadow text-sm whitespace-nowrap"
            >
              ⚡ Fetch & Sync
            </button>
          </div>
        </div>

        <!-- Grouped Containers -->
        <div id="groupsContainer" class="w-full">
          <div
            class="py-8 text-center text-gray-400 italic border-2 border-dashed border-gray-300 rounded-lg"
          >
            Select a section and click "Fetch & Sync" to begin.
          </div>
        </div>
      </div>
    </div>

    <<!-- Grading Modal -->
    <div
      id="gradingModal"
      class="hidden fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-[120] p-4"
    >
      <div
        class="bg-white rounded-xl shadow-2xl max-w-2xl w-full flex flex-col overflow-hidden"
      >
        <div
          class="p-5 border-b bg-slate-800 flex justify-between items-center"
        >
          <div>
            <h2 class="text-xl font-bold text-white">Evaluate Student Work</h2>
            <p
              class="text-xs text-cyan-400 mt-1 font-mono"
              id="modalStudentName"
            >
              Student Name
            </p>
          </div>
          <button
            onclick="closeGradingModal()"
            class="text-slate-400 hover:text-white text-2xl font-bold"
          >
            &times;
          </button>
        </div>
        <div class="p-6 overflow-y-auto max-h-[70vh] bg-gray-50">
          <div class="mb-5 bg-white p-4 border rounded shadow-sm">
            <span
              class="text-[10px] font-bold text-gray-400 uppercase tracking-wider"
              >Target Repository</span
            >
            <div
              class="text-sm font-mono text-gray-700 mt-1"
              id="modalStudentRepo"
            >
              owner/repo
            </div>
          </div>

          <h3
            class="font-bold text-gray-800 mb-3 border-b pb-2 text-sm uppercase tracking-wider"
          >
            Active Deployments
          </h3>

          <!-- Dynamic Task List (This is what the JS was looking for!) -->
          <div id="dynamicAssessmentsList" class="space-y-3">
            <div class="text-center text-gray-400 italic py-4 text-sm">
              Loading assigned tasks...
            </div>
          </div>

          <div class="mt-6 flex justify-end">
            <button
              onclick="closeGradingModal()"
              class="bg-gray-200 text-gray-800 px-6 py-2 rounded text-sm font-bold hover:bg-gray-300 transition"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="js/core/adminerva-loader.js"></script>
    <script type="module" src="js/repo-review/repofetch.js"></script>
    <script type="module" src="js/repo-review/auto-checker.js"></script>
  </body>
</html>
