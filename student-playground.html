<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />
    <title>Code Playground | Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Monaco Editor Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <style>
      /* Hide scrollbar for the output frame but allow scrolling */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body
    class="bg-slate-50 font-sans text-slate-800 h-screen flex flex-col hidden overflow-hidden"
    id="pageBody"
  >
    <!-- ✨ Notice the new data-module and data-page -->
    <div
      id="adminerva-nav"
      data-module="student-playground"
      data-page="ide"
    ></div>

    <main class="flex-grow flex flex-col w-full h-[calc(100vh-4rem)]">
      <!-- IDE Toolbar -->
      <header
        class="bg-white border-b border-slate-200 px-4 sm:px-6 py-3 flex flex-col sm:flex-row justify-between items-center gap-4 shrink-0 z-10 shadow-sm"
      >
        <div class="flex items-center gap-3 w-full sm:w-auto">
          <div class="flex items-center gap-2">
            <span class="text-xl">⚡</span>
            <h1
              class="text-lg font-extrabold text-slate-900 tracking-tight hidden md:block"
            >
              Playground
            </h1>
          </div>

          <div class="h-6 w-px bg-slate-300 hidden sm:block mx-2"></div>

          <!-- Language Selector -->
          <select
            id="languageSelect"
            class="w-full sm:w-auto text-sm border-slate-300 rounded-md shadow-sm focus:ring-cyan-500 focus:border-cyan-500 font-bold bg-slate-50 px-3 py-2 text-slate-700 cursor-pointer outline-none border transition"
          >
            <option value="java" selected>Java (JDK 17)</option>
            <option value="python">Python 3</option>
            <option value="web">WebDev (HTML/CSS/JS)</option>
            <option value="csharp">C# (.NET)</option>
            <option value="cpp">C++ (GCC)</option>
            <option value="dart">Dart</option>
          </select>

          <!-- Template Selector -->
          <select
            id="templateSelect"
            class="hidden sm:block text-sm border-slate-300 rounded-md shadow-sm focus:ring-cyan-500 focus:border-cyan-500 font-medium bg-white px-3 py-2 text-slate-600 cursor-pointer outline-none border transition max-w-[150px]"
          >
            <option value="default">Hello World</option>
            <option value="loop">For Loop Demo</option>
            <option value="oop">Basic OOP Class</option>
          </select>
        </div>

        <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
          <button
            id="resetBtn"
            class="text-xs font-bold text-slate-500 hover:text-slate-700 bg-slate-100 hover:bg-slate-200 px-3 py-2 rounded-lg transition border border-slate-200 shadow-sm"
          >
            Reset Code
          </button>
          <button
            id="runBtn"
            class="text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-500 px-6 py-2 rounded-lg transition shadow-md flex items-center gap-2 border border-emerald-700"
          >
            <span>▶</span> Run Code
          </button>
        </div>
      </header>

      <!-- Workspace Area -->
      <div
        class="flex-grow flex flex-col lg:flex-row overflow-hidden bg-slate-900"
      >
        <!-- Left Pane: Code Editor -->
        <div
          class="w-full lg:w-3/5 h-1/2 lg:h-full flex flex-col border-b lg:border-b-0 lg:border-r border-slate-700 relative"
        >
          <div
            class="bg-slate-800 px-4 py-2 flex justify-between items-center border-b border-slate-700 shrink-0"
          >
            <span
              class="text-xs font-bold text-slate-400 uppercase tracking-widest"
              id="editorTabLabel"
              >Main.java</span
            >
            <div class="flex gap-1.5">
              <div class="w-2.5 h-2.5 rounded-full bg-rose-500/80"></div>
              <div class="w-2.5 h-2.5 rounded-full bg-amber-500/80"></div>
              <div class="w-2.5 h-2.5 rounded-full bg-emerald-500/80"></div>
            </div>
          </div>
          <!-- Monaco Mount Point -->
          <div id="editorContainer" class="flex-grow w-full relative">
            <div
              id="editorLoading"
              class="absolute inset-0 flex items-center justify-center bg-slate-900 z-10"
            >
              <span class="text-cyan-400 font-bold animate-pulse text-sm"
                >Initializing Monaco Engine...</span
              >
            </div>
          </div>
        </div>

        <!-- Right Pane: Output Console / Web Preview -->
        <div
          class="w-full lg:w-2/5 h-1/2 lg:h-full flex flex-col bg-[#0d1117] relative"
        >
          <div
            class="bg-slate-800 px-4 py-2 flex justify-between items-center border-b border-slate-700 shrink-0"
          >
            <div class="flex gap-4">
              <span
                class="text-xs font-bold text-cyan-400 uppercase tracking-widest border-b-2 border-cyan-400 pb-1 cursor-pointer"
                id="consoleTab"
                >Terminal Output</span
              >
              <span
                class="text-xs font-bold text-slate-500 uppercase tracking-widest hover:text-slate-300 transition pb-1 cursor-pointer hidden"
                id="previewTab"
                >Web Preview</span
              >
            </div>
            <button
              id="clearConsoleBtn"
              class="text-[10px] text-slate-400 hover:text-white transition uppercase font-bold tracking-wider"
            >
              Clear
            </button>
          </div>

          <!-- Output Views -->
          <div class="flex-grow relative overflow-hidden p-4">
            <!-- Terminal Output (For Java, Python, C#, C++, Dart) -->
            <pre
              id="consoleOutput"
              class="w-full h-full text-sm font-mono text-slate-300 overflow-y-auto no-scrollbar whitespace-pre-wrap break-words"
            >
System ready. Waiting for execution...</pre
            >

            <!-- Web Preview (For HTML/CSS/JS) -->
            <div
              id="webPreviewContainer"
              class="hidden absolute inset-0 bg-white"
            >
              <iframe
                id="webPreviewFrame"
                class="w-full h-full border-0"
                sandbox="allow-scripts allow-modals"
              ></iframe>
            </div>

            <!-- Execution Loader Overlay -->
            <div
              id="executionOverlay"
              class="hidden absolute inset-0 bg-[#0d1117]/80 backdrop-blur-[2px] flex items-center justify-center z-20"
            >
              <div class="flex flex-col items-center gap-3">
                <svg
                  class="animate-spin h-6 w-6 text-emerald-500"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                >
                  <circle
                    class="opacity-20"
                    cx="12"
                    cy="12"
                    r="10"
                    stroke="currentColor"
                    stroke-width="4"
                  ></circle>
                  <path
                    class="opacity-100"
                    fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
                  ></path>
                </svg>
                <span
                  class="text-xs font-bold text-emerald-400 tracking-widest uppercase"
                  >Compiling Code...</span
                >
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Adminerva Core Scripts -->
    <script src="js/core/adminerva-nav.js"></script>
    <script src="js/core/adminerva-loader.js"></script>
    <script type="module" src="js/core/auth-guard.js"></script>
    <!-- Playground Logic -->
    <script type="module" src="js/student/playground.js"></script>
  </body>
</html>
