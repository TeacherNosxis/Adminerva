<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LessonReview - AI Curriculum Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col">

    <!-- GLOBAL NAVIGATION -->
    <nav class="bg-gray-900 text-white shadow-md relative z-50">
        <div class="max-w-screen-2xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="relative group cursor-pointer py-2">
                <div class="flex items-center gap-2 text-xl font-bold text-blue-400 hover:text-blue-300 transition">
                    <span>📘</span> <span id="currentAppName">LessonReview</span> <span class="text-[10px] text-gray-400">▼</span>
                </div>
                <div class="absolute left-0 top-full pt-2 w-56 hidden group-hover:block z-[100]">
                    <div class="bg-white rounded-md shadow-2xl border border-gray-200 overflow-hidden">
                        <div class="px-4 py-2 bg-gray-50 border-b border-gray-200 text-[10px] font-bold text-gray-400 uppercase tracking-wider">Switch Workspace</div>
                        <a href="index.html" class="block px-4 py-3 text-sm font-bold text-gray-800 hover:bg-purple-50 hover:text-purple-700 border-b border-gray-100 transition">⚡ RepoReview System</a>
                        <a href="lesson-planner.html" class="block px-4 py-3 text-sm font-bold text-gray-800 hover:bg-blue-50 hover:text-blue-700 transition">📘 LessonReview</a>
                    </div>
                </div>
            </div>

            <div class="flex gap-6 text-sm font-semibold">
                <a href="lesson-planner.html" class="text-white border-b-2 border-blue-500 pb-1">AI Planner</a>
                <a href="schedule.html" class="text-gray-400 hover:text-white transition">Teacher's Schedule</a>
                <a href="library.html" class="text-gray-400 hover:text-white transition">Reference Library</a>
            </div>

            <div>
                <a href="settings.html" class="bg-gray-800 border border-gray-700 hover:bg-gray-700 px-3 py-1.5 rounded text-gray-300 hover:text-white transition flex items-center gap-2 font-semibold text-sm shadow-inner">
                    <span>⚙️</span> Global Settings
                </a>
            </div>
        </div>
    </nav>

    <div class="max-w-screen-2xl mx-auto w-full p-6 mt-2 flex-1 flex flex-col">
        
        <!-- TOP SECTION: Configuration Banner -->
        <div class="w-full bg-white p-6 rounded-lg shadow-sm border border-gray-200 mb-6">
            <h2 class="text-xl font-bold text-gray-800 border-b pb-2 mb-4">Lesson Configuration</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">School Year</label>
                    <input type="text" id="lpSchoolYear" value="2026-2027" class="w-full p-2 border rounded text-sm bg-gray-50 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Semester</label>
                    <select id="lpSemester" class="w-full p-2 border rounded text-sm bg-gray-50 focus:ring-blue-500">
                        <option>1st Semester</option><option>2nd Semester</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Quarter</label>
                    <select id="lpQuarter" class="w-full p-2 border rounded text-sm bg-gray-50 focus:ring-blue-500">
                        <option>1st Quarter</option><option>2nd Quarter</option><option>3rd Quarter</option><option>4th Quarter</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Target Month</label>
                    <select id="lpMonth" class="w-full p-2 border rounded text-sm bg-gray-50 focus:ring-blue-500">
                        <option value="August">August</option><option value="September">September</option>
                        <option value="October">October</option><option value="November">November</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Target Week</label>
                    <select id="lpWeek" class="w-full p-2 border rounded text-sm bg-gray-50 focus:ring-blue-500">
                        <option value="Week 1">Week 1</option><option value="Week 2">Week 2</option>
                        <option value="Week 3">Week 3</option><option value="Week 4">Week 4</option><option value="Week 5">Week 5</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
                <div>
                    <label class="block text-xs font-extrabold text-blue-700 uppercase mb-2">Master Context / Topic</label>
                    <textarea id="lpContent" rows="4" class="w-full p-3 border border-blue-200 rounded text-sm bg-blue-50 focus:ring-blue-500 shadow-inner" placeholder="Paste your DepEd/TESDA standards, overarching topic, or specific instructions here..."></textarea>
                </div>
                <div>
                    <label class="block text-xs font-extrabold text-blue-700 uppercase mb-2">Select Reference Folders</label>
                    <div id="libraryFolderContainer" class="bg-blue-50 border border-blue-200 rounded p-3 h-[110px] overflow-y-auto space-y-2 shadow-inner">
                        <!-- Checkboxes injected via JS -->
                    </div>
                </div>
            </div>

            <button onclick="generateLessonPlan()" class="w-full bg-blue-600 text-white font-bold py-3 rounded hover:bg-blue-700 shadow-md transition flex justify-center items-center gap-2">
                <span>🤖</span> Generate Dual Plans
            </button>
        </div>

        <!-- BOTTOM SECTION: Full Width Output -->
        <div class="w-full bg-white rounded-lg shadow-sm border border-gray-200 flex flex-col flex-1">
            <div id="weeklyOverviewContainer" class="bg-gray-100 border-b border-gray-200 hidden flex-col"></div>

            <div class="flex border-b bg-gray-50">
                <button onclick="switchTab('g11')" id="tab-g11" class="flex-1 py-3 text-sm font-bold border-b-2 border-blue-600 text-blue-700 transition">Grade 11 (5 Sessions)</button>
                <button onclick="switchTab('g12')" id="tab-g12" class="flex-1 py-3 text-sm font-bold border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition">Grade 12 (4 Sessions)</button>
            </div>
            
            <div id="outputContainer" class="p-6 overflow-y-auto bg-gray-50 flex-1 min-h-[400px]">
                <div class="text-center text-gray-400 italic mt-20">Select your scope and folders to generate plans.</div>
            </div>
            
            <div class="p-4 border-t bg-white flex justify-end gap-3">
                <button class="px-6 py-2 bg-gray-200 text-gray-700 font-bold rounded shadow-sm hover:bg-gray-300">Save Draft</button>
                <button class="px-6 py-2 bg-green-600 text-white font-bold rounded shadow-sm hover:bg-green-700 flex items-center gap-2"><span>📥</span> Export PDF</button>
            </div>
        </div>
    </div>

    <!-- DYNAMIC LOADING OVERLAY -->
    <div id="globalLoader" class="hidden fixed inset-0 bg-gray-900 bg-opacity-85 z-[100] items-center justify-center flex-col">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-500 border-solid mb-4"></div>
        <p id="loaderDynamicText" class="text-white font-bold text-2xl tracking-wider mb-2 text-center transition-opacity duration-500">AI Architecting Syllabus...</p>
        <p class="text-blue-300 text-sm font-semibold">Please do not close this window.</p>
    </div>

    <script type="module" src="lesson-planner.js?v=3"></script>
</body>
</html>
