<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Adminerva</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50 h-screen flex items-center justify-center font-sans">
    <div
      class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 w-full max-w-sm"
    >
      <h2 class="text-2xl font-extrabold mb-2 text-center text-slate-800">Welcome Back</h2>
        <p id="subtitleText" class="text-sm text-slate-500 text-center mb-8">Sign in to access your dashboard.</p>
        
        <!-- LOGIN UI (Visible if keys exist) -->
        <div id="loginBlock" class="space-y-4">
            <!-- GitHub Button -->
            <button id="githubBtn" class="w-full flex justify-center items-center gap-2 bg-[#24292F] text-white p-3 rounded-lg hover:bg-[#1f2328] transition font-medium">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"></path></svg>
                Sign in with GitHub
            </button>

            <!-- Google Button -->
            <button id="googleBtn" class="w-full flex justify-center items-center gap-2 bg-white text-slate-700 border border-slate-300 p-3 rounded-lg hover:bg-slate-50 transition font-medium">
                <svg class="w-5 h-5" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                Sign in with Google
            </button>

            <div class="relative flex items-center py-2">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink-0 mx-4 text-slate-400 text-xs uppercase tracking-wider">or</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <!-- Anonymous Button (Test) -->
            <button id="anonBtn" class="w-full flex justify-center items-center bg-slate-100 text-slate-600 p-3 rounded-lg hover:bg-slate-200 transition font-medium text-sm">
                Continue as Guest (Test Mode)
            </button>
        </div>

        <!-- EMERGENCY SETUP UI (Hidden by default) -->
        <div id="setupBlock" class="hidden space-y-4">
            <div class="p-3 bg-amber-50 border border-amber-200 text-amber-800 text-sm rounded-lg">
                <strong>System Offline:</strong> No Firebase credentials found on this device. Paste your configuration object below to activate the portal.
            </div>
            <textarea id="firebaseConfigInput" class="w-full h-40 p-3 border border-slate-300 rounded-lg text-xs font-mono bg-slate-50 focus:ring-2 focus:ring-blue-500" placeholder='{
  "apiKey": "AIzaSy...",
  "authDomain": "...",
  "projectId": "..."
}'></textarea>
            <button id="saveConfigBtn" class="w-full bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700 transition font-bold">
                Save Keys & Reload
            </button>
        </div>

        <div id="authError" class="mt-4 text-red-600 text-sm hidden text-center bg-red-50 p-2 rounded border border-red-100"></div>
    </div>
    <!-- Link to the external JavaScript file as a module -->
    <script type="module" src="js/core/login.js"></script>
</body>
</html>
  </body>
</html>
