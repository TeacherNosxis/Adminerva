<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adminerva | Secure Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-slate-900 h-screen flex flex-col items-center justify-center font-sans text-slate-300"
  >
    <div
      class="bg-slate-800 p-8 rounded-xl shadow-2xl border border-slate-700 max-w-md w-full mx-4"
    >
      <div class="text-center mb-8">
        <span
          class="text-3xl font-black text-white tracking-wider flex items-center justify-center gap-2 mb-2"
        >
          <span class="text-cyan-500">❖</span> ADMINERVA
        </span>
        <p class="text-sm text-slate-400 font-medium">Secure Gateway</p>
      </div>

      <div id="loginForm" class="space-y-4">
        <div>
          <label
            class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1"
            >Email Address</label
          >
          <input
            type="email"
            id="emailInput"
            class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-cyan-500 transition"
            placeholder="student@example.com"
          />
        </div>
        <div>
          <label
            class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1"
            >Password</label
          >
          <input
            type="password"
            id="passwordInput"
            class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-cyan-500 transition"
            placeholder="••••••••"
          />
        </div>
        <button
          id="loginBtn"
          class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-2.5 rounded-lg transition shadow-lg mt-4"
        >
          Secure Sign In
        </button>
        <p
          id="loginError"
          class="text-xs font-bold text-red-400 text-center hidden mt-3"
        ></p>
      </div>
    </div>

    <!-- Link to your modular login script -->
    <script type="module" src="js/core/login.js"></script>
  </body>
</html>
