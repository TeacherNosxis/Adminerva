<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LessonReview - Teacher's Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  </head>
  <body class="bg-gray-50 font-sans min-h-screen flex flex-col">
    <div id="adminerva-nav" data-module="lesson" data-page="schedule"></div>
    <script src="js/core/adminerva-nav.js"></script>

    <!-- Main Workspace -->
    <div class="max-w-screen-2xl mx-auto w-full p-6 mt-4 flex-1 flex flex-col">
      <div
        class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 flex-1 flex flex-col"
      >
        <div
          class="flex justify-between items-end mb-4 pb-4 border-b border-gray-200"
        >
          <div class="flex items-center gap-3">
            <div>
              <h2 class="text-2xl font-bold text-gray-800">
                Master Teaching Schedule
              </h2>
              <p class="text-sm text-gray-500 mt-1">
                Schedule is locked by default. Click Edit to modify timeslots.
              </p>
            </div>
            <span
              id="modeBadge"
              class="bg-gray-200 text-gray-700 text-xs font-extrabold px-3 py-1 rounded-full uppercase tracking-wider"
              >🔒 Read-Only</span
            >
          </div>
          <div class="flex gap-3">
            <button
              onclick="openSettingsModal()"
              class="bg-gray-800 text-white px-4 py-2 rounded font-bold hover:bg-gray-700 transition shadow-sm flex items-center gap-2"
            >
              <span>⚙️</span> Settings
            </button>
            <!-- These buttons only appear in Edit Mode -->
            <button
              id="addClassBtn"
              onclick="addRow('class')"
              class="hidden bg-blue-100 text-blue-800 border border-blue-300 px-4 py-2 rounded font-bold hover:bg-blue-200 transition shadow-sm items-center gap-2"
            >
              <span>➕</span> Class Row
            </button>
            <button
              id="addEventBtn"
              onclick="addRow('constant')"
              class="hidden bg-amber-100 text-amber-800 border border-amber-300 px-4 py-2 rounded font-bold hover:bg-amber-200 transition shadow-sm items-center gap-2"
            >
              <span>➕</span> Weekly Event
            </button>
            <!-- Main Toggle -->
            <button
              id="editSaveBtn"
              onclick="toggleEditMode()"
              class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700 transition shadow-sm flex items-center gap-2"
            >
              <span>✏️</span> Edit Schedule
            </button>
          </div>
        </div>

        <!-- Flexible Schedule Table -->
        <div class="flex-1 overflow-x-auto border border-gray-200 rounded">
          <table class="min-w-full bg-white">
            <thead class="bg-gray-100 border-b-2 border-gray-200">
              <tr>
                <th
                  class="py-3 px-4 text-left text-xs font-bold text-gray-600 uppercase w-[15%]"
                >
                  Time Slot
                </th>
                <th
                  class="py-3 px-2 text-center text-xs font-bold text-gray-600 uppercase w-[16%]"
                >
                  Monday
                </th>
                <th
                  class="py-3 px-2 text-center text-xs font-bold text-gray-600 uppercase w-[16%]"
                >
                  Tuesday
                </th>
                <th
                  class="py-3 px-2 text-center text-xs font-bold text-gray-600 uppercase w-[16%]"
                >
                  Wednesday
                </th>
                <th
                  class="py-3 px-2 text-center text-xs font-bold text-gray-600 uppercase w-[16%]"
                >
                  Thursday
                </th>
                <th
                  class="py-3 px-2 text-center text-xs font-bold text-gray-600 uppercase w-[16%]"
                >
                  Friday
                </th>
                <th
                  class="py-3 px-2 text-center text-xs font-bold text-gray-400 uppercase w-[5%]"
                ></th>
              </tr>
            </thead>
            <tbody id="scheduleTableBody">
              <!-- Dynamic Rows -->
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- SCHEDULE SETTINGS MODAL -->
    <div
      id="settingsModal"
      class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 z-[100] items-center justify-center"
    >
      <div
        class="bg-white w-full max-w-lg rounded-lg shadow-2xl flex flex-col overflow-hidden"
      >
        <div
          class="px-6 py-4 border-b bg-gray-50 flex justify-between items-center"
        >
          <h3 class="text-lg font-bold text-gray-800">⚙️ Schedule Settings</h3>
          <button
            onclick="closeSettingsModal()"
            class="text-gray-400 hover:text-red-500 font-bold transition"
          >
            ✖
          </button>
        </div>
        <div class="p-6 space-y-4">
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1"
              >My Sections (Comma Separated)</label
            >
            <input
              type="text"
              id="configSections"
              placeholder="e.g. Grade 11-A, Grade 12-B"
              class="w-full p-2 border rounded text-sm focus:ring-blue-500 bg-gray-50"
            />
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1"
              >My Subjects (Comma Separated)</label
            >
            <input
              type="text"
              id="configSubjects"
              placeholder="e.g. Comprog, Work Immersion"
              class="w-full p-2 border rounded text-sm focus:ring-blue-500 bg-gray-50"
            />
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1"
              >My Events (Comma Separated)</label
            >
            <input
              type="text"
              id="configEvents"
              placeholder="e.g. Lunch Break, Holy Mass, Assembly"
              class="w-full p-2 border rounded text-sm focus:ring-blue-500 bg-amber-50 border-amber-200"
            />
            <p class="text-[10px] text-gray-500 mt-1">
              Events are used for non-teaching periods.
            </p>
          </div>
        </div>
        <div class="px-6 py-4 border-t bg-gray-50 flex justify-end gap-3">
          <button
            onclick="closeSettingsModal()"
            class="px-4 py-2 text-gray-600 font-bold hover:text-gray-800"
          >
            Cancel
          </button>
          <button
            onclick="saveSettingsConfig()"
            class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700 shadow-sm"
          >
            Save Options
          </button>
        </div>
      </div>
    </div>
    <!-- GLOBAL LOADING OVERLAY -->
    <div
      id="globalLoader"
      class="hidden fixed inset-0 bg-gray-900 bg-opacity-80 z-[110] items-center justify-center flex-col"
    >
      <div
        class="animate-spin rounded-full h-16 w-16 border-t-4 border-blue-500 border-solid mb-4"
      ></div>
      <p id="loaderMessage" class="text-white font-bold text-lg tracking-wider">
        Syncing to Cloud...
      </p>
    </div>
    <script type="module" src="js/lesson-review/schedule.js"></script>
  </body>
</html>
