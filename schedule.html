<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LessonReview - Teacher's Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col">

    <!-- GLOBAL NAVIGATION (LessonReview Theme) -->
    <nav class="bg-gray-900 text-white shadow-md relative z-50">
        <div class="max-w-screen-2xl mx-auto px-6 py-4 flex justify-between items-center">
            
            <!-- LEFT: The App Switcher Dropdown -->
            <div class="relative group cursor-pointer py-2">
                <div class="flex items-center gap-2 text-xl font-bold text-blue-400 hover:text-blue-300 transition">
                    <span>📘</span> 
                    <span id="currentAppName">LessonReview</span>
                    <span class="text-[10px] text-gray-400">▼</span>
                </div>
                
                <div class="absolute left-0 top-full pt-2 w-56 hidden group-hover:block z-[100]">
                    <div class="bg-white rounded-md shadow-2xl border border-gray-200 overflow-hidden">
                        <div class="px-4 py-2 bg-gray-50 border-b border-gray-200 text-[10px] font-bold text-gray-400 uppercase tracking-wider">Switch Workspace</div>
                        <a href="index.html" class="block px-4 py-3 text-sm font-bold text-gray-800 hover:bg-purple-50 hover:text-purple-700 border-b border-gray-100 transition">
                            ⚡ RepoReview System
                        </a>
                        <a href="lesson-planner.html" class="block px-4 py-3 text-sm font-bold text-gray-800 hover:bg-blue-50 hover:text-blue-700 transition">
                            📘 LessonReview
                        </a>
                    </div>
                </div>
            </div>

            <!-- CENTER: LessonReview Links -->
            <div class="flex gap-6 text-sm font-semibold">
                <a href="lesson-planner.html" class="text-gray-400 hover:text-white transition">AI Planner</a>
                <a href="schedule.html" class="text-white border-b-2 border-blue-500 pb-1">Teacher's Schedule</a>
            </div>

            <!-- RIGHT: Global Settings -->
            <div>
                <a href="settings.html" class="bg-gray-800 border border-gray-700 hover:bg-gray-700 px-3 py-1.5 rounded text-gray-300 hover:text-white transition flex items-center gap-2 font-semibold text-sm shadow-inner">
                    <span>⚙️</span> Global Settings
                </a>
            </div>

        </div>
    </nav>

    <!-- Main Workspace -->
    <div class="max-w-screen-2xl mx-auto w-full p-6 mt-4 flex-1 flex flex-col">
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 flex-1 flex flex-col">
            
            <div class="flex justify-between items-end mb-4 pb-4 border-b border-gray-200">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800">Master Teaching Schedule</h2>
                    <p class="text-sm text-gray-500 mt-1">Configure your dropdowns below, then build your weekly timeslots.</p>
                </div>
                <div class="flex gap-3">
                    <button onclick="addRow()" class="bg-gray-100 text-gray-700 border border-gray-300 px-4 py-2 rounded font-bold hover:bg-gray-200 transition shadow-sm flex items-center gap-2">
                        <span>➕</span> Add Time Slot
                    </button>
                    <button onclick="saveSchedule()" class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700 transition shadow-sm flex items-center gap-2">
                        <span>💾</span> Save Schedule
                    </button>
                </div>
            </div>

            <!-- Dropdown Configuration Panel -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 bg-gray-50 p-4 rounded border border-gray-200 shadow-inner">
                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">My Subjects (Comma Separated)</label>
                    <input type="text" id="configSubjects" placeholder="e.g. Comprog, Work Immersion" class="w-full p-2 border rounded text-sm font-semibold focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">My Sections (Comma Separated)</label>
                    <input type="text" id="configSections" placeholder="e.g. St. Isidore, St. Carlo Acutis" class="w-full p-2 border rounded text-sm font-semibold focus:ring-blue-500">
                </div>
                <div class="md:col-span-2 flex justify-end">
                    <button onclick="updateDropdownConfig()" class="bg-gray-800 text-white px-4 py-2 rounded font-bold text-xs hover:bg-gray-700 transition shadow">
                        Update Dropdown Menus
                    </button>
                </div>
            </div>
            
            <!-- Flexible Schedule Table -->
            <div class="flex-1 overflow-x-auto border border-gray-200 rounded">
                <table class="min-w-full bg-white">
                    <thead class="bg-gray-100 border-b-2 border-gray-200">
                        <tr>
                            <th class="py-3 px-4 text-left text-xs font-bold text-gray-600 uppercase w-[15%]">Time Slot</th>
                            <th class="py-3 px-2 text-center text-xs font-bold text-gray-600 uppercase w-[16%]">Monday</th>
                            <th class="py-3 px-2 text-center text-xs font-bold text-gray-600 uppercase w-[16%]">Tuesday</th>
                            <th class="py-3 px-2 text-center text-xs font-bold text-gray-600 uppercase w-[16%]">Wednesday</th>
                            <th class="py-3 px-2 text-center text-xs font-bold text-gray-600 uppercase w-[16%]">Thursday</th>
                            <th class="py-3 px-2 text-center text-xs font-bold text-gray-600 uppercase w-[16%]">Friday</th>
                            <th class="py-3 px-2 text-center text-xs font-bold text-gray-400 uppercase w-[5%]"></th>
                        </tr>
                    </thead>
                    <tbody id="scheduleTableBody">
                        <!-- Dynamic Rows injected via JS -->
                    </tbody>
                </table>
            </div>
            
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toastNotification" class="fixed bottom-5 right-5 bg-green-600 text-white px-6 py-3 rounded shadow-xl font-bold transition-opacity duration-300 opacity-0 pointer-events-none">
        ✅ Schedule Saved Successfully!
    </div>

    <script type="module" src="schedule.js"></script>
</body>
</html>
