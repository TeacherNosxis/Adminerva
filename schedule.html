<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LessonReview - Teacher's Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col">

    <!-- GLOBAL NAVIGATION (LessonReview Theme) -->
    <nav class="bg-gray-900 text-white shadow-md relative z-50">
        <div class="max-w-screen-2xl mx-auto px-6 py-4 flex justify-between items-center">
            
            <!-- LEFT: The App Switcher Dropdown -->
            <div class="relative group cursor-pointer py-2">
                <div class="flex items-center gap-2 text-xl font-bold text-blue-400 hover:text-blue-300 transition">
                    <span>📘</span> 
                    <span id="currentAppName">LessonReview</span>
                    <span class="text-[10px] text-gray-400">▼</span>
                </div>
                
                <div class="absolute left-0 top-full pt-2 w-56 hidden group-hover:block z-[100]">
                    <div class="bg-white rounded-md shadow-2xl border border-gray-200 overflow-hidden">
                        <div class="px-4 py-2 bg-gray-50 border-b border-gray-200 text-[10px] font-bold text-gray-400 uppercase tracking-wider">Switch Workspace</div>
                        <a href="index.html" class="block px-4 py-3 text-sm font-bold text-gray-800 hover:bg-purple-50 hover:text-purple-700 border-b border-gray-100 transition">
                            ⚡ RepoReview System
                        </a>
                        <a href="lesson-planner.html" class="block px-4 py-3 text-sm font-bold text-gray-800 hover:bg-blue-50 hover:text-blue-700 transition">
                            📘 LessonReview
                        </a>
                    </div>
                </div>
            </div>

            <!-- CENTER: LessonReview Links -->
            <div class="flex gap-6 text-sm font-semibold">
                <a href="lesson-planner.html" class="text-gray-400 hover:text-white transition">AI Planner</a>
                <a href="schedule.html" class="text-white border-b-2 border-blue-500 pb-1">Teacher's Schedule</a>
            </div>

            <!-- RIGHT: Global Settings -->
            <div>
                <a href="settings.html" class="bg-gray-800 border border-gray-700 hover:bg-gray-700 px-3 py-1.5 rounded text-gray-300 hover:text-white transition flex items-center gap-2 font-semibold text-sm shadow-inner">
                    <span>⚙️</span> Global Settings
                </a>
            </div>

        </div>
    </nav>

    <!-- Main Workspace -->
    <div class="max-w-screen-lg mx-auto w-full p-6 mt-4 flex-1 flex flex-col">
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 flex-1 flex flex-col">
            
            <div class="flex justify-between items-end mb-6 pb-4 border-b border-gray-200">
                <div>
                    <h2 class="text-2xl font-bold text-gray-800">Master Teaching Schedule</h2>
                    <p class="text-sm text-gray-500 mt-1">Paste your semester schedule here. The AI will automatically reference this when mapping intervention remarks.</p>
                </div>
                <button onclick="saveSchedule()" class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700 transition shadow flex items-center gap-2">
                    <span>💾</span> Save Schedule
                </button>
            </div>
            
            <!-- Schedule Input Area -->
            <div class="flex-1 flex flex-col">
                <label class="block text-xs font-bold text-gray-600 uppercase mb-2">Raw Schedule Text</label>
                <textarea id="scheduleInput" class="w-full flex-1 p-4 border rounded font-mono text-sm bg-gray-50 focus:ring-blue-500 leading-relaxed placeholder-gray-400" placeholder="Paste your schedule here...&#10;&#10;Example:&#10;St. Isidore of Seville&#10;Session 1&#10;Jul 14, 2026&#10;12:40pm - 1:30pm"></textarea>
            </div>
            
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toastNotification" class="fixed bottom-5 right-5 bg-green-600 text-white px-6 py-3 rounded shadow-xl font-bold transition-opacity duration-300 opacity-0 pointer-events-none">
        ✅ Schedule Saved Successfully!
    </div>

    <script type="module" src="schedule.js"></script>
</body>
</html>
